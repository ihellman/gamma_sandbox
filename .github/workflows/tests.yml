# Runs the unit tests on every push / pull request. Browser (shinytest2) tests
# are skipped on CI via skip_on_ci(); everything else runs against the exact
# package versions in renv.lock.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for sf / terra / arrow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Run testthat
        run: Rscript tests/testthat.R
